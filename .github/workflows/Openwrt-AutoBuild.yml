#=================================================
# Build OpenWrt for M68S (rockchip_armv8)
# Author: General (based on P3TERX)
#=================================================

name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      target:
        description: '选择编译目标设备'
        required: true
        default: 'rockchip_armv8'

env:
  REPO_TOKEN: ${{ secrets.TOKEN_KIDDIN9 }}
  TZ: Asia/Shanghai
  UPLOAD_FIRMWARE_FOR_ARTIFACT: true
  DIY_SH: diy.sh
  CONFIG_FILE: .config

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["${{ github.event.inputs.target }}"]

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Ensure OpenWrt source
      run: |
        if [ ! -d "openwrt" ]; then
          git clone -b openwrt-25.12 https://github.com/openwrt/openwrt openwrt
        fi

    - name: Load DIY script
      run: |
        chmod +x devices/common/$DIY_SH
        /bin/bash "devices/common/$DIY_SH"
        cp -f devices/common/$CONFIG_FILE .config
        if [ -f "devices/${{matrix.target}}/$CONFIG_FILE" ]; then
          cat devices/${{matrix.target}}/$CONFIG_FILE >> .config
        fi

    - name: Defconfig
      run: |
        cd openwrt
        make defconfig
        cat .config

    - name: Compile firmware
      run: |
        cd openwrt
        echo "Using $(($(nproc)+1)) threads to compile..."
        make -j$(($(nproc)+1))

    - name: List firmware
      run: |
        echo "Generated files:"
        ls -lh openwrt/bin/targets/rockchip/armv8/

    - name: Upload M68S firmware artifact
      uses: actions/upload-artifact@v3
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true'
      with:
        name: ${{ github.run_number }}_${{matrix.target}}_M68S
        path: |
          openwrt/bin/targets/rockchip/armv8/kwrt-*-ezpro_mrkaio-m68s-squashfs-sysupgrade.img.gz
