#=================================================
# Build OpenWrt (M68S Only)
# Based on P3TERX Actions-OpenWrt
#=================================================

name: Build OpenWrt M68S

on:
  workflow_dispatch:
  repository_dispatch:

env:
  REPO_TOKEN: ${{ secrets.TOKEN_KIDDIN9 }}
  TZ: Asia/Shanghai
  UPLOAD_FIRMWARE_FOR_ARTIFACT: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build rockchip_armv8 (M68S)

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    # -------------------------
    # 安装编译依赖
    # -------------------------
    - name: Initialization environment
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget \
        llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
        libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
        sudo timedatectl set-timezone "Asia/Shanghai"

    # -------------------------
    # 克隆 OpenWrt 源码
    # -------------------------
    - name: Clone source code
      run: |
        git clone https://github.com/openwrt/openwrt -b openwrt-25.12 openwrt

    # -------------------------
    # 复制你的 devices 目录配置
    # -------------------------
    - name: Load custom configuration
      run: |
        cp -rf devices/common/. openwrt/ || true
        cp -rf devices/rockchip_armv8/. openwrt/ || true
        cd openwrt
        chmod +x devices/common/diy.sh || true
        [ -f devices/common/diy.sh ] && /bin/bash devices/common/diy.sh

        cp -f devices/common/.config .config || true
        [ -f devices/rockchip_armv8/.config ] && cat devices/rockchip_armv8/.config >> .config

    # -------------------------
    # Defconfig
    # -------------------------
    - name: Defconfig
      run: |
        cd openwrt
        make defconfig
        cat .config

    # -------------------------
    # 编译
    # -------------------------
    - name: Compile firmware
      run: |
        cd openwrt
        echo "Using $(($(nproc)+1)) threads..."
        make -j$(($(nproc)+1))

    # -------------------------
    # 调试输出文件
    # -------------------------
    - name: Debug firmware files
      run: |
        echo "==== Generated Files ===="
        ls -lh openwrt/bin/targets/rockchip/armv8/

    # -------------------------
    # 只上传 M68S sysupgrade 固件
    # -------------------------
    - name: Upload M68S firmware
      uses: actions/upload-artifact@v4
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true'
      with:
        name: M68S_Firmware_${{ github.run_number }}
        path: |
          openwrt/bin/targets/rockchip/armv8/*m68s*sysupgrade*.img.gz
